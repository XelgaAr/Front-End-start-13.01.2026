<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Registration</title>
</head>

<body>
    <div class="content">
        <button class="top" type="button">Login</button>
        <button class="top reg" type="button">Register</button>
        <p clas="emai"> Enter your email and password to register</p>
        <form action="">
            <p>
                <input type="text" name="username" placeholder="Username" required>
            </p>
            <p>
                <input type="email" name="email" placeholder="Enter your email address" required>
            </p>
            <p>
                <input type="password" name="password" placeholder="Password" required>
            </p>
            <p>
                <input type="password" name="confirm password" placeholder="Confirm Password" required>
            </p>
            <button class="register" type="submit">Register</button>
            <!-- <input type="submit" value="Register>" -->
        </form>
        <p class="or">Or register with</p>
        <div class="conteiner">
            <a href="#">
                <img src="./img/Google.png" alt="Google">
                <span>Continue with Google</span>

            </a>
        </div>
        <div class="conteiner facebook">
            <a href="#">
                <img src="./img/facebook 1.png" alt="Facebook">
                <span>Continue width Facebook</span>
            </a>
        </div>
    </div>
</body>

</html>
